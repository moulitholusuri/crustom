name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --bin crustom --target aarch64-apple-darwin
          cargo build --release --bin crustom --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/crustom \
            target/x86_64-apple-darwin/release/crustom \
            -output target/release/crustom
          lipo -info target/release/crustom

      - name: Package app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CRUSTOM_SKIP_BUILD=1 cargo run --release --bin package-macos
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Crustom.app \
            "Crustom-${VERSION}-macOS-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: Crustom-*-macOS-universal.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Windows executable
        run: cargo build --release --bin crustom

      - name: Package Windows build
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/crustom.exe package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "Crustom-$version-Windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Crustom-*-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
