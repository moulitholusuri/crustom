[package]
name = "crustom"
version = "0.14.0"
edition = "2024"
description = "Crustom — billing intelligence desktop dashboard"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
calamine = { version = "0.37", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.4"
directories = "6"
encoding_rs = "0.8"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
ureq = "3.5"

[dev-dependencies]
rust_xlsxwriter = "0.102"

[profile.release]
lto = "thin"
strip = true
